<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} — {{PERSON_NAME}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --ink: {{INK}}; --paper: {{PAPER}}; --wall: {{ENV_1}}; --accent: {{ACCENT}}; --muted: {{MUTED}}; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #D8D5CE; }
    body { display: grid; place-items: center; }
    .poster { position: relative; width: 600px; height: 800px; overflow: hidden; isolation: isolate; background: var(--wall); color: var(--paper); }
    .portrait { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{OBJECT_POSITION}}; filter: saturate({{SATURATION}}) contrast({{CONTRAST}}) brightness({{BRIGHTNESS}}); }
    .light-fusion { position: absolute; inset: 0; background: radial-gradient(ellipse at 55% 35%, transparent 42%, {{VIGNETTE_RGBA}} 100%), linear-gradient(to top, {{MASK_RGBA_STRONG}} 0%, {{MASK_RGBA_MID}} 21%, {{MASK_RGBA_CLEAR}} 60%); }
    .micro { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 500; line-height: 1.4; letter-spacing: 0.25em; text-transform: uppercase; }
    .topline { position: absolute; top: 29px; left: 32px; right: 32px; z-index: 20; display: flex; justify-content: space-between; color: {{MICRO_COLOR}}; }
    .masthead { position: absolute; top: {{MASTHEAD_TOP}}px; left: {{MASTHEAD_LEFT}}px; z-index: 20; color: {{MASTHEAD_COLOR}}; font-family: 'Cormorant Garamond', serif; font-weight: 400; line-height: 0.9; letter-spacing: -0.045em; mix-blend-mode: {{BLEND_MODE}}; }
    .masthead span { display: block; }
    .masthead .one { font-size: {{EN_SIZE_1}}px; }
    .masthead .two { margin-top: 10px; margin-left: {{EN_INDENT}}px; font-size: {{EN_SIZE_2}}px; font-style: italic; font-weight: 300; }
    .vertical-note { position: absolute; top: 124px; right: 24px; z-index: 20; writing-mode: vertical-rl; color: {{MICRO_COLOR}}; }
    .accent-rule { position: absolute; left: 36px; bottom: 222px; z-index: 20; width: 44px; height: 2px; background: var(--accent); }
    .headline { position: absolute; left: 34px; bottom: 91px; z-index: 20; margin: 0; font-family: 'Noto Serif SC', serif; font-size: {{TITLE_SIZE_1}}px; font-weight: 500; line-height: 1.08; letter-spacing: -0.045em; }
    .headline span { display: block; }
    .headline .emphasis { margin-top: 8px; font-size: {{TITLE_SIZE_2}}px; font-weight: 600; }
    .subtitle { position: absolute; left: 37px; bottom: 55px; z-index: 20; margin: 0; font-family: 'Noto Serif SC', serif; font-size: 14px; letter-spacing: 0.12em; color: var(--muted); }
    .footer { position: absolute; left: 32px; right: 32px; bottom: 27px; z-index: 20; display: flex; justify-content: space-between; font-size: 8px; color: var(--muted); }
    .frame { position: absolute; inset: 16px; z-index: 30; border: 1px solid {{FRAME_COLOR}}; pointer-events: none; }
    .noise { position: absolute; inset: 0; z-index: 40; width: 100%; height: 100%; opacity: 0.04; mix-blend-mode: soft-light; pointer-events: none; }
    @page { size: 600px 800px; margin: 0; }
    @media print { html, body { width: 600px; height: 800px; background: transparent; } .poster { print-color-adjust: exact; -webkit-print-color-adjust: exact; } }
  </style>
</head>
<body>
  <main id="cover" class="poster" aria-label="{{ARIA_LABEL}}">
    <img class="portrait" src="{{PHOTO_URL}}" alt="{{PHOTO_ALT}}">
    <div class="light-fusion"></div>
    <header class="topline micro"><span>{{PERSON_NAME}} / {{SERIES_NAME}}</span><span>{{ISSUE}} / {{YEAR}}</span></header>
    <div class="masthead" aria-label="{{EN_TITLE_1}} {{EN_TITLE_2}}"><span class="one">{{EN_TITLE_1}}</span><span class="two">{{EN_TITLE_2}}</span></div>
    <div class="vertical-note micro">{{VERTICAL_NOTE}}</div>
    <div class="accent-rule"></div>
    <h1 class="headline"><span>{{TITLE_LINE_1}}</span><span class="emphasis">{{TITLE_LINE_2}}</span></h1>
    <p class="subtitle">{{BYLINE}}</p>
    <footer class="footer micro"><span>{{FOOTER_LEFT}}</span><span>{{FOOTER_RIGHT}}</span></footer>
    <div class="frame"></div>
    <svg class="noise" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><filter id="paper-noise"><feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#paper-noise)"/></svg>
  </main>
</body>
</html>
